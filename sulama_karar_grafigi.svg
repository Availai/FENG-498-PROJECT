<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">14 Günlük Akıllı Sulama Karar Grafiği</title>
  <desc id="desc">Akıllı Tarım Asistanı için örnek 14 günlük net su ihtiyacı ve sulama önceliği grafiği.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fffb"/>
      <stop offset="0.55" stop-color="#eef7fb"/>
      <stop offset="1" stop-color="#f6fbef"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="warnBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dangerBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#0f5f7a"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#133d33" flood-opacity="0.16"/>
    </filter>
    <filter id="soft2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#133d33" flood-opacity="0.12"/>
    </filter>
    <style>
      .font { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 56px; font-weight: 900; fill: #08213f; letter-spacing: 0; }
      .subtitle { font-size: 27px; font-weight: 500; fill: #36566c; }
      .axis { stroke: #24485d; stroke-width: 4; }
      .grid { stroke: #cbded2; stroke-width: 2; opacity: 0.85; }
      .tick { font-size: 22px; font-weight: 700; fill: #36566c; }
      .label { font-size: 24px; font-weight: 800; fill: #0b2a45; }
      .card-title { font-size: 25px; font-weight: 800; fill: #0b2a45; }
      .card-value { font-size: 39px; font-weight: 900; fill: #0f3d2e; }
      .card-text { font-size: 21px; font-weight: 600; fill: #486878; }
      .legend { font-size: 22px; font-weight: 700; fill: #0b2a45; }
      .note { font-size: 22px; font-weight: 600; fill: #31546a; }
      .callout-title { font-size: 28px; font-weight: 900; fill: #ffffff; }
      .callout-text { font-size: 22px; font-weight: 600; fill: #eafff4; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg2)"/>
  <circle cx="1565" cy="168" r="240" fill="#d8f0ea" opacity="0.62"/>
  <circle cx="210" cy="980" r="300" fill="#e3f3d8" opacity="0.55"/>

  <g class="font">
    <text x="88" y="104" class="title">14 Günlük Akıllı Sulama Karar Grafiği</text>
    <text x="90" y="150" class="subtitle">Örnek tarla için hava tahmini, yağış ve FAO ETo hesabından üretilmiş net su ihtiyacı.</text>
  </g>

  <g transform="translate(90 210)" filter="url(#shadow2)">
    <rect x="0" y="0" width="1620" height="730" rx="34" fill="#ffffff" stroke="#b9d4c0" stroke-width="2"/>
    <rect x="36" y="36" width="1548" height="102" rx="24" fill="url(#header)"/>
    <text x="68" y="78" class="font callout-title">Sulama ihtiyacı nasıl hesaplanır?</text>
    <text x="68" y="116" class="font callout-text">Net ihtiyaç = tahmini buharlaşma-terleme + ürün katsayısı - etkili yağış</text>
    <g transform="translate(1120 52)">
      <rect width="132" height="58" rx="18" fill="#ffffff" opacity="0.14"/>
      <text x="66" y="37" text-anchor="middle" class="font callout-text">Örnek veri</text>
      <rect x="152" width="186" height="58" rx="18" fill="#ffffff" opacity="0.14"/>
      <text x="245" y="37" text-anchor="middle" class="font callout-text">mm/gün</text>
    </g>

    <g transform="translate(130 210)">
      <rect x="0" y="0" width="1340" height="420" rx="22" fill="#fbfffc" stroke="#d8e8db"/>
      <line x1="0" y1="70" x2="1340" y2="70" class="grid"/>
      <line x1="0" y1="140" x2="1340" y2="140" class="grid"/>
      <line x1="0" y1="210" x2="1340" y2="210" class="grid"/>
      <line x1="0" y1="280" x2="1340" y2="280" class="grid"/>
      <line x1="0" y1="350" x2="1340" y2="350" class="grid"/>
      <line x1="0" y1="420" x2="1340" y2="420" class="axis"/>
      <line x1="0" y1="0" x2="0" y2="420" class="axis"/>

      <text x="-28" y="428" text-anchor="end" class="font tick">0</text>
      <text x="-28" y="358" text-anchor="end" class="font tick">1</text>
      <text x="-28" y="288" text-anchor="end" class="font tick">2</text>
      <text x="-28" y="218" text-anchor="end" class="font tick">3</text>
      <text x="-28" y="148" text-anchor="end" class="font tick">4</text>
      <text x="-28" y="78" text-anchor="end" class="font tick">5</text>
      <text x="-28" y="8" text-anchor="end" class="font tick">6</text>

      <rect x="25" y="210" width="56" height="210" rx="14" fill="url(#greenBar)"/>
      <rect x="117" y="182" width="56" height="238" rx="14" fill="url(#greenBar)"/>
      <rect x="209" y="196" width="56" height="224" rx="14" fill="url(#greenBar)"/>
      <rect x="301" y="126" width="56" height="294" rx="14" fill="url(#warnBar)"/>
      <rect x="393" y="98" width="56" height="322" rx="14" fill="url(#warnBar)"/>
      <rect x="485" y="63" width="56" height="357" rx="14" fill="url(#dangerBar)"/>
      <rect x="577" y="175" width="56" height="245" rx="14" fill="url(#greenBar)"/>
      <rect x="669" y="322" width="56" height="98" rx="14" fill="url(#blueBar)"/>
      <rect x="761" y="133" width="56" height="287" rx="14" fill="url(#warnBar)"/>
      <rect x="853" y="112" width="56" height="308" rx="14" fill="url(#warnBar)"/>
      <rect x="945" y="140" width="56" height="280" rx="14" fill="url(#warnBar)"/>
      <rect x="1037" y="161" width="56" height="259" rx="14" fill="url(#greenBar)"/>
      <rect x="1129" y="259" width="56" height="161" rx="14" fill="url(#greenBar)"/>
      <rect x="1221" y="196" width="56" height="224" rx="14" fill="url(#greenBar)"/>

      <polyline points="53,140 145,126 237,112 329,91 421,70 513,49 605,42 697,70 789,91 881,112 973,140 1065,161 1157,175 1249,196" fill="none" stroke="#075985" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="53" cy="140" r="9" fill="#075985"/>
      <circle cx="145" cy="126" r="9" fill="#075985"/>
      <circle cx="237" cy="112" r="9" fill="#075985"/>
      <circle cx="329" cy="91" r="9" fill="#075985"/>
      <circle cx="421" cy="70" r="9" fill="#075985"/>
      <circle cx="513" cy="49" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
      <circle cx="605" cy="42" r="9" fill="#075985"/>
      <circle cx="697" cy="70" r="9" fill="#075985"/>
      <circle cx="789" cy="91" r="9" fill="#075985"/>
      <circle cx="881" cy="112" r="9" fill="#075985"/>
      <circle cx="973" cy="140" r="9" fill="#075985"/>
      <circle cx="1065" cy="161" r="9" fill="#075985"/>
      <circle cx="1157" cy="175" r="9" fill="#075985"/>
      <circle cx="1249" cy="196" r="9" fill="#075985"/>

      <g class="font tick">
        <text x="53" y="462" text-anchor="middle">1</text>
        <text x="145" y="462" text-anchor="middle">2</text>
        <text x="237" y="462" text-anchor="middle">3</text>
        <text x="329" y="462" text-anchor="middle">4</text>
        <text x="421" y="462" text-anchor="middle">5</text>
        <text x="513" y="462" text-anchor="middle">6</text>
        <text x="605" y="462" text-anchor="middle">7</text>
        <text x="697" y="462" text-anchor="middle">8</text>
        <text x="789" y="462" text-anchor="middle">9</text>
        <text x="881" y="462" text-anchor="middle">10</text>
        <text x="973" y="462" text-anchor="middle">11</text>
        <text x="1065" y="462" text-anchor="middle">12</text>
        <text x="1157" y="462" text-anchor="middle">13</text>
        <text x="1249" y="462" text-anchor="middle">14</text>
      </g>

      <text x="670" y="512" text-anchor="middle" class="font label">Gün</text>
      <text x="-88" y="210" transform="rotate(-90 -88 210)" text-anchor="middle" class="font label">Net su ihtiyacı</text>

      <g transform="translate(865 24)">
        <rect x="0" y="0" width="430" height="76" rx="18" fill="#ffffff" stroke="#d8e8db" opacity="0.96"/>
        <rect x="20" y="22" width="42" height="22" rx="8" fill="url(#greenBar)"/>
        <text x="74" y="42" class="font legend">Bar: net su ihtiyacı</text>
        <line x1="252" y1="34" x2="315" y2="34" stroke="#075985" stroke-width="7" stroke-linecap="round"/>
        <circle cx="284" cy="34" r="8" fill="#075985"/>
        <text x="328" y="42" class="font legend">ETo</text>
      </g>
    </g>
  </g>

  <g class="font" transform="translate(100 980)">
    <g filter="url(#soft2)">
      <rect x="0" y="0" width="380" height="130" rx="26" fill="#ffffff" stroke="#b9d4c0" stroke-width="2"/>
      <text x="34" y="42" class="card-title">En yüksek ihtiyaç</text>
      <text x="34" y="92" class="card-value">5,1 mm</text>
      <text x="210" y="92" class="card-text">6. gün</text>
    </g>
    <g transform="translate(420 0)" filter="url(#soft2)">
      <rect x="0" y="0" width="380" height="130" rx="26" fill="#ffffff" stroke="#b9d4c0" stroke-width="2"/>
      <text x="34" y="42" class="card-title">Yağış etkisi</text>
      <text x="34" y="92" class="card-value">Düşüş</text>
      <text x="205" y="92" class="card-text">8. gün</text>
    </g>
    <g transform="translate(840 0)" filter="url(#soft2)">
      <rect x="0" y="0" width="380" height="130" rx="26" fill="#ffffff" stroke="#b9d4c0" stroke-width="2"/>
      <text x="34" y="42" class="card-title">Önerilen aksiyon</text>
      <text x="34" y="92" class="card-value">Sulama</text>
      <text x="218" y="92" class="card-text">6. gün</text>
    </g>
    <g transform="translate(1260 0)" filter="url(#soft2)">
      <rect x="0" y="0" width="360" height="130" rx="26" fill="#0f4f2a"/>
      <text x="34" y="42" font-size="25" font-weight="800" fill="#ffffff">Karar çıktısı</text>
      <text x="34" y="88" font-size="28" font-weight="900" fill="#ffffff">Zamanında sulama</text>
    </g>
  </g>
</svg>
